<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - STACKLY</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* Reuse Auth Styles from Login */
    .auth-page {
      min-height: 100vh;
      display: flex;
      background-color: var(--bg-dark);
    }
    
    .auth-visual {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .auth-visual::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('assets/images/img-9.webp') center/cover;
      opacity: 0.15;
      mix-blend-mode: luminosity;
    }

    .auth-visual-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 3rem;
    }

    .auth-form-container {
      width: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem;
      background: var(--bg-dark);
      border-left: 1px solid var(--border-color);
      position: relative;
      z-index: 10;
    }

    @media (max-width: 992px) {
      .auth-visual { display: none; }
      .auth-form-container {
        width: 100%;
        border-left: none;
        align-items: center;
      }
      .auth-form-wrapper { width: 100%; max-width: 400px; }
    }
  </style>
</head>
<body>

  <!-- Preloader -->
  <div class="preloader">
    <div class="loader-wrapper">
      <img src="assets/images/logo-pink.webp" alt="STACKLY" class="loader-logo">
      <div class="loader-spinner"></div>
    </div>
  </div>

  <!-- Page Transition Overlay -->
  <div class="page-transition-overlay"></div>

  <div class="auth-page">
    
    <!-- Left Visual Side -->
    <div class="auth-visual">
      <div class="bg-gradient-animated" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index:1; opacity:0.5;"></div>
      <div class="auth-visual-content">
        <h2 class="display-5 fw-bold text-white mb-4 hero-text-animate">Secure Access.</h2>
        <p class="text-muted fs-5 mb-0 hero-text-animate">Recover your account securely.</p>
      </div>
    </div>

    <!-- Right Form Side -->
    <div class="auth-form-container">
      <div class="auth-form-wrapper w-100">
        
        <!-- Logo -->
        <a href="home.html" class="navbar-brand d-inline-block mb-5">
          STACKLY<span class="text-accent">.</span>
        </a>

        <div class="mb-4">
          <i class="bi bi-key text-accent fs-1"></i>
        </div>

        <h1 class="h3 fw-bold mb-2">Reset Your Password</h1>
        <p class="text-muted mb-4">Enter your email address and we'll send you a link to reset your password.</p>

        <!-- Reset Form -->
        <form class="needs-validation" novalidate>
          <div class="mb-4">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <button type="submit" class="btn-primary w-100 mb-4">Send Reset Link &rarr;</button>
        </form>

        <p class="text-center text-muted fs-7" style="font-size: 0.9rem;">
          <a href="login.html" class="text-white text-decoration-none fw-bold"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      gsap.from('.auth-form-wrapper > *', {
        y: 20,
        opacity: 0,
        duration: 0.6,
        stagger: 0.1,
        ease: 'power2.out',
        delay: 0.2
      });
      if(window.triggerHeroAnimation) window.triggerHeroAnimation();
    });
  </script>
  <script src="js/layout.js"></script>
</body>
</html>
